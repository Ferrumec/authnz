name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  TARGET: aarch64-linux-android
  ANDROID_API: 35
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: Build Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "NDK=${NDK}"
          echo "TOOLCHAIN=${TOOLCHAIN}"

          # Verify the compiler exists.
          test -x "${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"

          # Make the Android toolchain available to cc-rs/ring.
          echo "${TOOLCHAIN}" >> "${GITHUB_PATH}"

          # Explicit compiler configuration.
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang" >> "${GITHUB_ENV}"
          echo "CXX_aarch64_linux_android=${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++" >> "${GITHUB_ENV}"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/llvm-ar" >> "${GITHUB_ENV}"

          # Cargo's final linker.
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang" >> "${GITHUB_ENV}"

      - name: Verify Android compiler
        run: |
          which aarch64-linux-android${ANDROID_API}-clang
          aarch64-linux-android${ANDROID_API}-clang --version

      - name: Configure Cargo
        run: |
          mkdir -p .cargo

          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang"
          ar = "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          EOF

          cat .cargo/config.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Build release
        run: |
          cargo build \
            --release \
            --locked \
            --target "${TARGET}"

      - name: Get package name
        id: package
        shell: bash
        run: |
          NAME="$(cargo metadata \
            --no-deps \
            --format-version 1 \
            | jq -r '.packages[0].name')"

          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify binary
        run: |
          file \
            "target/${TARGET}/release/${{ steps.package.outputs.name }}"

      - name: Package binary
        shell: bash
        run: |
          NAME="${{ steps.package.outputs.name }}"
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="${NAME}-${VERSION}-${TARGET}"

          mkdir -p "dist/${ARCHIVE}"

          cp \
            "target/${TARGET}/release/${NAME}" \
            "dist/${ARCHIVE}/${NAME}"

          chmod +x \
            "dist/${ARCHIVE}/${NAME}"

          cp README.md \
            "dist/${ARCHIVE}/" 2>/dev/null || true

          cp LICENSE \
            "dist/${ARCHIVE}/" 2>/dev/null || true

          tar \
            -C dist \
            -czf "dist/${ARCHIVE}.tar.gz" \
            "${ARCHIVE}"

      - name: Generate checksum
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
