[package]
name = "authnz"
version = "0.1.2"
edition = "2024"

[dependencies]
actix-web = "4.4"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "migrate", "uuid", "ipnetwork"] }
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
rand = "0.10"
base64 = "0.22.1"
serde_json = "1.0.145"
sha2 = "0.10.9"
futures = "0.3.31"
moka = { version = "0.12.13", features = ["future"] }
actixutils = { version = "0.7.0-b", features = ["jwt"] }
webauthn-rs = {version="0.5.4", optional=true}
tracing = "0.1.44"
async-trait = "0.1.89"
viewset = "0.4.3-b"
awc = "3.8.2"
ferrumec = { version = "0.1.0", features = ["distributed"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zxcvbn = "3.1.1"
validator = { version = "0.20.0", features = ["derive"] }
tokio = { version = "1.53.1", features = ["sync"] }
futures-util = "0.3.34"
ipnet = "2.12.1"
dotenvy = "0.15.0"
ipnetwork = { version = "0.21.1", features = ["serde"] }
infra = { path = "../infra" }

[features]
passkey = ["webauthn-rs"]

